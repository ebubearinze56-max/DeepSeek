<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EbubZ AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: #16213e;
      border-radius: 12px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      padding: 16px 20px;
      background: #0f3460;
      border-bottom: 1px solid #2a2a4a;
    }
    .chat-header h1 {
      font-size: 1.3rem;
      font-weight: 600;
    }
    .chat-header .creator {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-top: 2px;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .user-message {
      align-self: flex-end;
      background: #0f3460;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot-message {
      align-self: flex-start;
      background: #1a1a2e;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #2a2a4a;
      background: #0f3460;
    }
    #user-input {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    #send-button {
      margin-left: 8px;
      padding: 10px 20px;
      background: #e94560;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send-button:hover { background: #c23152; }
    #send-button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .error-message {
      color: #e94560;
      text-align: center;
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>🤖 EbubZ AI</h1>
      <div class="creator">by Ebube Arinze</div>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Ask anything..." autofocus>
      <button id="send-button">Send</button>
    </div>
  </div>

  <script>
    // ====================== CONFIGURATION – GROQ (FREE) ======================
    const API_KEY = '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';
    const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
    const MODEL = 'llama3-8b-8192';   // Free, fast model

    // ====================== DOM ELEMENTS ======================
    const messagesContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');

    function addMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
      msgDiv.textContent = text;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addError(text) {
      const errDiv = document.createElement('div');
      errDiv.classList.add('error-message');
      errDiv.textContent = '❌ ' + text;
      messagesContainer.appendChild(errDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendMessage(userMessage) {
      addMessage(userMessage, 'user');
      userInput.disabled = true;
      sendButton.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: 'system', content: 'You are EbubZ AI, a helpful assistant created by Ebube Arinze.' },
              { role: 'user', content: userMessage }
            ],
            temperature: 0.7,
            max_tokens: 2000
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const botReply = data.choices[0].message.content;
        addMessage(botReply, 'bot');

      } catch (error) {
        console.error('API Error:', error);
        addError(error.message || 'Failed to get reply.');
      } finally {
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
      }
    }

    sendButton.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (text) {
        sendMessage(text);
        userInput.value = '';
      }
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = userInput.value.trim();
        if (text) {
          sendMessage(text);
          userInput.value = '';
        }
      }
    });

    addMessage("Hello! I'm EbubZ AI, created by Ebube Arinze. How can I help you today?", 'bot');
  </script>
</body>
</html>
