<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>EbubZ AI</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --sidebar-bg: #16213e;
      --msg-bot: #2a2a4a;
      --msg-user: #0f3460;
      --header-bg: #0f3460;
      --input-bg: #1a1a2e;
      --text: #e0e0e0;
      --border: #2a2a4a;
      --accent: #e94560;
      --code-bg: #0d1117;
    }
    body.light {
      --bg: #f5f5f5;
      --sidebar-bg: #ffffff;
      --msg-bot: #e9e9eb;
      --msg-user: #d1e4ff;
      --header-bg: #e0e0e0;
      --input-bg: #ffffff;
      --text: #1a1a1a;
      --border: #cccccc;
      --accent: #d6336c;
      --code-bg: #f0f0f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }
    .app { display: flex; height: 100vh; width: 100%; }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 10;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-header h1 { font-size: 1.2rem; font-weight: 600; }
    .sidebar-header .creator { font-size: 0.7rem; opacity: 0.6; }
    .new-chat-btn, .clear-all-btn {
      width: 100%;
      padding: 10px;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .new-chat-btn { background: var(--accent); }
    .new-chat-btn:hover { filter: brightness(1.1); }
    .clear-all-btn { background: #555; margin-top: 4px; font-size: 0.8rem; }
    .clear-all-btn:hover { background: #777; }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      word-break: break-word;
      color: var(--text);
    }
    .chat-item:hover { background: rgba(255,255,255,0.1); }
    .chat-item.active { background: var(--header-bg); }
    .chat-item .title { flex: 1; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-item .delete-btn { background: none; border: none; color: var(--accent); font-size: 1rem; cursor: pointer; margin-left: 8px; opacity: 0.6; }
    .chat-item .delete-btn:hover { opacity: 1; }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      min-width: 0;
    }
    .chat-header {
      padding: 16px 20px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .menu-toggle { background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; display: none; }
    #current-chat-title {
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s;
      outline: none;
      color: var(--text);
    }
    #current-chat-title:hover { border-bottom-color: #aaa; }
    #current-chat-title[contenteditable="true"] { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; border-bottom: none; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .model-selector select {
      padding: 6px 10px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      color: var(--text);
    }
    .theme-toggle:hover { background: rgba(255,255,255,0.1); }

    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      position: relative;
      color: var(--text);
    }
    .user-message { align-self: flex-end; background: var(--msg-user); border-bottom-right-radius: 4px; }
    .bot-message { align-self: flex-start; background: var(--msg-bot); border-bottom-left-radius: 4px; }
    .message-actions { display: flex; gap: 6px; margin-top: 6px; opacity: 0; transition: opacity 0.2s; }
    .bot-message:hover .message-actions { opacity: 1; }
    .action-btn {
      background: rgba(128,128,128,0.2);
      border: none;
      color: var(--text);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn:hover { background: rgba(128,128,128,0.4); }
    .code-block {
      background: var(--code-bg);
      padding: 12px;
      border-radius: 6px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 8px 0;
      white-space: pre;
      color: var(--text);
    }
    .file-attachment {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 6px;
      margin-bottom: 8px;
    }
    .file-attachment img { max-width: 200px; max-height: 150px; border-radius: 4px; }
    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--header-bg);
      gap: 8px;
    }
    #user-input {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    #send-button, #file-upload-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send-button:hover, #file-upload-btn:hover { filter: brightness(1.1); }
    #send-button:disabled { background: #555; cursor: not-allowed; }
    #file-input { display: none; }
    .error-message { color: var(--accent); text-align: center; padding: 8px; font-size: 0.9rem; }

    .overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 9;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0;
        transform: translateX(-100%);
        width: 280px; z-index: 20;
        transition: transform 0.3s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .overlay.open { display: block; }
      .menu-toggle { display: block; }
      .model-selector { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>🤖 EbubZ AI</h1>
        <div class="creator">by Ebube Arinze</div>
        <button class="new-chat-btn" id="new-chat-btn">＋ New Chat</button>
        <button class="clear-all-btn" id="clear-all-btn">🗑️ Clear all chats</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="overlay" id="overlay"></div>

    <!-- MAIN -->
    <div class="main">
      <div class="chat-header">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span id="current-chat-title" title="Click to rename">New Chat</span>
        <div class="header-actions">
          <div class="model-selector">
            <select id="model-select">
              <option value="llama-3.1-8b-instant">Llama 3.1 8B (fast)</option>
              <option value="gemma2-9b-it">Gemma 2 9B</option>
              <option value="llama-3.2-3b-preview">Llama 3.2 3B (preview)</option>
            </select>
          </div>
          <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask anything..." autofocus>
        <button id="file-upload-btn" title="Upload image or text file">📎</button>
        <input type="file" id="file-input" accept="image/*,.txt,.md,.csv">
        <button id="send-button">Send</button>
      </div>
    </div>
  </div>

  <script>
    // ====================== CONFIGURATION ======================
    const BACKEND_URL = '/api/chat';   // Vercel serverless function
    let currentModel = localStorage.getItem('ebubz_model') || 'llama-3.1-8b-instant';
    let attachedFile = null;

    // ====================== DOM ELEMENTS ======================
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const chatListEl = document.getElementById('chat-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const clearAllBtn = document.getElementById('clear-all-btn');
    const messagesContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const currentChatTitle = document.getElementById('current-chat-title');
    const modelSelect = document.getElementById('model-select');
    const themeToggle = document.getElementById('theme-toggle');
    const fileUploadBtn = document.getElementById('file-upload-btn');
    const fileInput = document.getElementById('file-input');

    // ====================== STATE ======================
    let chats = {};
    let currentChatId = null;

    // ====================== LOCAL STORAGE ======================
    function saveChats() { localStorage.setItem('ebubz_chats', JSON.stringify(chats)); }
    function loadChats() { const s = localStorage.getItem('ebubz_chats'); chats = s ? JSON.parse(s) : {}; }
    function saveModel() { localStorage.setItem('ebubz_model', currentModel); }

    // ====================== THEME ======================
    const themeSaved = localStorage.getItem('ebubz_theme') || 'dark';
    document.body.classList.toggle('light', themeSaved === 'light');
    themeToggle.textContent = themeSaved === 'light' ? '☀️' : '🌙';
    themeToggle.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light');
      localStorage.setItem('ebubz_theme', isLight ? 'light' : 'dark');
      themeToggle.textContent = isLight ? '☀️' : '🌙';
    });

    // ====================== FILE HANDLING ======================
    fileUploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.type.startsWith('image/')) {
        // Image upload – we no longer have a free vision model.
        // Inform the user and fall back to text.
        attachedFile = null;
        fileInput.value = '';
        addError('Image upload is not supported on the free tier. Vision model has been deprecated. Please use text only.');
        userInput.focus();
        return;
      } else {
        // Text file
        const text = await file.text();
        userInput.value = text;
        attachedFile = null;
        fileInput.value = '';
        userInput.focus();
      }
    });

    // ====================== SIDEBAR ======================
    function renderChatList() {
      chatListEl.innerHTML = '';
      const ids = Object.keys(chats).sort((a, b) => (chats[b].timestamp || 0) - (chats[a].timestamp || 0));
      ids.forEach(id => {
        const chat = chats[id];
        const div = document.createElement('div');
        div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
        div.innerHTML = `<span class="title">${escapeHtml(chat.title || 'New Chat')}</span><button class="delete-btn" data-id="${id}">🗑️</button>`;
        div.querySelector('.title').addEventListener('click', () => switchChat(id));
        div.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteChat(id); });
        chatListEl.appendChild(div);
      });
    }

    function switchChat(id) { currentChatId = id; renderMessages(); renderChatList(); updateHeaderTitle(); closeSidebar(); }
    function newChat() {
      const id = Date.now().toString();
      chats[id] = { title: 'New Chat', messages: [], timestamp: Date.now() };
      currentChatId = id;
      saveChats();
      renderMessages();
      renderChatList();
      updateHeaderTitle();
      closeSidebar();
      userInput.focus();
    }
    function deleteChat(id) {
      if (confirm('Delete this conversation?')) {
        delete chats[id];
        saveChats();
        if (currentChatId === id) {
          const remaining = Object.keys(chats);
          currentChatId = remaining.length > 0 ? remaining[remaining.length - 1] : null;
          if (!currentChatId) newChat();
        }
        renderMessages();
        renderChatList();
        updateHeaderTitle();
      }
    }
    function clearAllChats() {
      if (Object.keys(chats).length && confirm('Delete ALL conversations?')) {
        chats = {};
        saveChats();
        newChat();
      }
    }

    // ====================== MESSAGES ======================
    function renderMessages() {
      messagesContainer.innerHTML = '';
      if (!currentChatId || !chats[currentChatId]) return;
      const msgs = chats[currentChatId].messages;
      msgs.forEach((msg, idx) => {
        addMessageElement(msg.text, msg.sender, idx, msg.attachment);
      });
      if (msgs.length && msgs[msgs.length-1].sender === 'bot') addActionButtonsToLastBotMessage();
    }

    function addMessageElement(text, sender, index = null, attachment = null) {
      const div = document.createElement('div');
      div.className = `message ${sender}-message`;
      let content = formatMessageText(text);
      if (attachment) content = `<div class="file-attachment"><img src="data:image/png;base64,${attachment.base64}" style="max-width:200px;max-height:150px;"></div>` + content;
      div.innerHTML = content;
      if (sender === 'bot') {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn'; copyBtn.textContent = '📋 Copy';
        copyBtn.addEventListener('click', () => { navigator.clipboard.writeText(text); copyBtn.textContent = '✅ Copied'; setTimeout(() => copyBtn.textContent = '📋 Copy', 2000); });
        actions.appendChild(copyBtn);
        div.appendChild(actions);
      }
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addActionButtonsToLastBotMessage() {
      const last = messagesContainer.querySelector('.bot-message:last-child');
      if (!last) return;
      const actions = last.querySelector('.message-actions');
      if (!actions || actions.querySelector('.regenerate-btn')) return;
      const regenBtn = document.createElement('button');
      regenBtn.className = 'action-btn regenerate-btn'; regenBtn.textContent = '🔄 Regenerate';
      regenBtn.addEventListener('click', regenerateLastResponse);
      actions.appendChild(regenBtn);
    }

    function formatMessageText(text) {
      return text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<div class="code-block">${escapeHtml(code.trim())}</div>`);
    }

    function addError(text) {
      const errDiv = document.createElement('div');
      errDiv.className = 'error-message';
      errDiv.textContent = '❌ ' + text;
      messagesContainer.appendChild(errDiv);
    }

    function updateHeaderTitle() {
      currentChatTitle.textContent = currentChatId && chats[currentChatId] ? (chats[currentChatId].title || 'New Chat') : 'New Chat';
    }

    function autoTitle(chatId, msg) {
      if (chats[chatId]?.title === 'New Chat') {
        chats[chatId].title = msg.length > 30 ? msg.substring(0,30)+'...' : msg;
        saveChats(); renderChatList(); updateHeaderTitle();
      }
    }

    // ====================== RENAME CHAT ======================
    currentChatTitle.addEventListener('click', () => {
      if (!currentChatId || !chats[currentChatId]) return;
      currentChatTitle.contentEditable = 'true';
      currentChatTitle.focus();
      const range = document.createRange(); range.selectNodeContents(currentChatTitle);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      const save = () => {
        currentChatTitle.contentEditable = 'false';
        chats[currentChatId].title = currentChatTitle.textContent.trim() || 'New Chat';
        saveChats(); renderChatList(); updateHeaderTitle();
        currentChatTitle.removeEventListener('blur', save);
        currentChatTitle.removeEventListener('keydown', onEnter);
      };
      const onEnter = (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } };
      currentChatTitle.addEventListener('blur', save);
      currentChatTitle.addEventListener('keydown', onEnter);
    });

    // ====================== API CALL (Vercel backend) ======================
    async function sendMessage(userMessage, isRegenerate = false) {
      if (!currentChatId) newChat();

      // Ignore image attachment as free vision model is not available
      if (attachedFile) {
        attachedFile = null;
        fileInput.value = '';
        const preview = document.querySelector('.file-attachment');
        if (preview) preview.remove();
      }

      if (!isRegenerate) {
        chats[currentChatId].messages.push({ text: userMessage, sender: 'user' });
        chats[currentChatId].timestamp = Date.now();
        saveChats();
        renderMessages();
        autoTitle(currentChatId, userMessage);
      } else {
        const msgs = chats[currentChatId].messages;
        if (msgs.length && msgs[msgs.length-1].sender === 'bot') msgs.pop();
        saveChats();
        renderMessages();
      }

      userInput.disabled = true;
      sendButton.disabled = true;

      const recent = chats[currentChatId].messages.slice(-10).map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));

      const systemMsg = { role: 'system', content: 'You are EbubZ AI, created by Ebube Arinze. Be helpful and concise.' };
      const apiMessages = [systemMsg, ...recent];

      addMessageElement('⏳ Thinking...', 'bot');
      const thinkingMsg = messagesContainer.lastChild;

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: currentModel,
            messages: apiMessages,
            temperature: 0.7,
            max_tokens: 2000
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          // Check if the error is about deprecated model
          if (errData.error && errData.error.includes('decommissioned')) {
            // Switch to default model and retry
            currentModel = 'llama-3.1-8b-instant';
            modelSelect.value = currentModel;
            saveModel();
            // Retry the request once
            const retryResponse = await fetch(BACKEND_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                model: currentModel,
                messages: apiMessages,
                temperature: 0.7,
                max_tokens: 2000
              })
            });
            if (retryResponse.ok) {
              const data = await retryResponse.json();
              thinkingMsg.remove();
              const botReply = data.choices[0].message.content;
              addMessageElement(botReply, 'bot');
              chats[currentChatId].messages.push({ text: botReply, sender: 'bot' });
              chats[currentChatId].timestamp = Date.now();
              saveChats();
              addActionButtonsToLastBotMessage();
              return;
            }
          }
          throw new Error(errData.error || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const botReply = data.choices[0].message.content;

        thinkingMsg.remove();
        addMessageElement(botReply, 'bot');
        chats[currentChatId].messages.push({ text: botReply, sender: 'bot' });
        chats[currentChatId].timestamp = Date.now();
        saveChats();
        addActionButtonsToLastBotMessage();

      } catch (error) {
        console.error(error);
        thinkingMsg.remove();
        addError(error.message || 'Failed to get reply');
      } finally {
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
      }
    }

    function regenerateLastResponse() {
      if (!currentChatId || !chats[currentChatId]) return;
      const msgs = chats[currentChatId].messages;
      if (msgs.length < 2) return;
      const lastUser = msgs[msgs.length-2];
      if (lastUser?.sender !== 'user') return;
      sendMessage(lastUser.text, true);
    }

    // ====================== SIDEBAR TOGGLE ======================
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

    // ====================== EVENT LISTENERS ======================
    menuToggle.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
    newChatBtn.addEventListener('click', newChat);
    clearAllBtn.addEventListener('click', clearAllChats);
    modelSelect.value = currentModel;
    modelSelect.addEventListener('change', (e) => { currentModel = e.target.value; saveModel(); });

    sendButton.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (text) {
        sendMessage(text);
        userInput.value = '';
      }
    });
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendButton.click();
      }
    });

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // ====================== INIT ======================
    function init() {
      loadChats();
      const ids = Object.keys(chats);
      if (ids.length) {
        currentChatId = ids.sort((a,b) => (chats[b].timestamp||0)-(chats[a].timestamp||0))[0];
      } else {
        newChat();
        return;
      }
      renderMessages();
      renderChatList();
      updateHeaderTitle();
    }
    init();
  </script>
</body>
</html>
