<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>EbubZ AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      width: 100%;
    }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: #16213e;
      border-right: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      position: relative;
      z-index: 10;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar-header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }
    .sidebar-header .creator {
      font-size: 0.7rem;
      opacity: 0.6;
    }
    .new-chat-btn, .clear-all-btn {
      display: block;
      width: 100%;
      padding: 10px;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .new-chat-btn {
      background: #e94560;
    }
    .new-chat-btn:hover { background: #c23152; }
    .clear-all-btn {
      background: #333;
      margin-top: 4px;
      font-size: 0.8rem;
    }
    .clear-all-btn:hover { background: #555; }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .chat-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .chat-item:hover { background: #2a2a5a; }
    .chat-item.active { background: #0f3460; }
    .chat-item .title {
      flex: 1;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-item .delete-btn {
      background: none;
      border: none;
      color: #e94560;
      font-size: 1rem;
      cursor: pointer;
      margin-left: 8px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .chat-item .delete-btn:hover { opacity: 1; }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1a1a2e;
      min-width: 0;
    }
    .chat-header {
      padding: 16px 20px;
      background: #0f3460;
      border-bottom: 1px solid #2a2a4a;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .menu-toggle {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      display: none;
    }
    #current-chat-title {
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px dashed transparent;
      transition: border-color 0.2s;
      outline: none;
    }
    #current-chat-title:hover { border-bottom-color: #aaa; }
    #current-chat-title[contenteditable="true"] {
      background: #16213e;
      padding: 2px 8px;
      border-radius: 4px;
      border-bottom: none;
    }
    .model-selector {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .model-selector select {
      padding: 6px 10px;
      background: #1a1a2e;
      color: #fff;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
      position: relative;
    }
    .user-message {
      align-self: flex-end;
      background: #0f3460;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bot-message {
      align-self: flex-start;
      background: #2a2a4a;
      color: #e0e0e0;
      border-bottom-left-radius: 4px;
    }
    .message-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .bot-message:hover .message-actions {
      opacity: 1;
    }
    .action-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .action-btn:hover { background: rgba(255,255,255,0.2); }
    .code-block {
      background: #0d1117;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.9rem;
      overflow-x: auto;
      margin: 8px 0;
      white-space: pre;
    }

    .input-area {
      display: flex;
      padding: 12px;
      border-top: 1px solid #2a2a4a;
      background: #0f3460;
    }
    #user-input {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #1a1a2e;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    #send-button {
      margin-left: 8px;
      padding: 10px 20px;
      background: #e94560;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send-button:hover { background: #c23152; }
    #send-button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .error-message {
      color: #e94560;
      text-align: center;
      padding: 8px;
      font-size: 0.9rem;
    }

    /* OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 9;
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        width: 280px;
        z-index: 20;
        transition: transform 0.3s ease;
      }
      .sidebar.open { transform: translateX(0); }
      .overlay.open { display: block; }
      .menu-toggle { display: block; }
      .model-selector { display: none; } /* hide on small screens to save space */
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>🤖 EbubZ AI</h1>
        <div class="creator">by Ebube Arinze</div>
        <button class="new-chat-btn" id="new-chat-btn">＋ New Chat</button>
        <button class="clear-all-btn" id="clear-all-btn">🗑️ Clear all chats</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <!-- OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- MAIN CHAT -->
    <div class="main">
      <div class="chat-header">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span id="current-chat-title" title="Click to rename">New Chat</span>
        <div class="model-selector">
          <label for="model-select">Model:</label>
          <select id="model-select">
            <option value="llama-3.1-8b-instant">Llama 3.1 8B (fast)</option>
            <option value="gemma2-9b-it">Gemma 2 9B</option>
            <option value="llama-3.2-3b-preview">Llama 3.2 3B (preview)</option>
          </select>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask anything..." autofocus>
        <button id="send-button">Send</button>
      </div>
    </div>
  </div>

  <script>
    // ====================== CONFIGURATION ======================
    const API_KEY = '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';
    const API_URL = 'https://api.groq.com/openai/v1/chat/completions';

    // ====================== DOM ELEMENTS ======================
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const chatListEl = document.getElementById('chat-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const clearAllBtn = document.getElementById('clear-all-btn');
    const messagesContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const currentChatTitle = document.getElementById('current-chat-title');
    const modelSelect = document.getElementById('model-select');

    // ====================== STATE ======================
    let chats = {};
    let currentChatId = null;
    let currentModel = localStorage.getItem('ebubz_model') || 'llama-3.1-8b-instant';

    // ====================== LOCAL STORAGE ======================
    function saveChats() {
      localStorage.setItem('ebubz_chats', JSON.stringify(chats));
    }
    function loadChats() {
      const stored = localStorage.getItem('ebubz_chats');
      chats = stored ? JSON.parse(stored) : {};
    }
    function saveModel() {
      localStorage.setItem('ebubz_model', currentModel);
    }

    // ====================== SIDEBAR RENDERING ======================
    function renderChatList() {
      chatListEl.innerHTML = '';
      const ids = Object.keys(chats).sort((a, b) => (chats[b].timestamp || 0) - (chats[a].timestamp || 0));
      ids.forEach(id => {
        const chat = chats[id];
        const div = document.createElement('div');
        div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
        div.innerHTML = `
          <span class="title">${escapeHtml(chat.title || 'New Chat')}</span>
          <button class="delete-btn" data-id="${id}">🗑️</button>
        `;
        div.querySelector('.title').addEventListener('click', () => switchChat(id));
        div.querySelector('.delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteChat(id);
        });
        chatListEl.appendChild(div);
      });
    }

    function switchChat(id) {
      currentChatId = id;
      renderMessages();
      renderChatList();
      updateHeaderTitle();
      closeSidebar();
    }

    function newChat() {
      const id = Date.now().toString();
      chats[id] = {
        title: 'New Chat',
        messages: [],
        timestamp: Date.now()
      };
      currentChatId = id;
      saveChats();
      renderMessages();
      renderChatList();
      updateHeaderTitle();
      closeSidebar();
      userInput.focus();
    }

    function deleteChat(id) {
      if (confirm('Delete this conversation?')) {
        delete chats[id];
        saveChats();
        if (currentChatId === id) {
          const remaining = Object.keys(chats);
          if (remaining.length > 0) {
            currentChatId = remaining[remaining.length - 1];
          } else {
            newChat();
            return;
          }
        }
        renderMessages();
        renderChatList();
        updateHeaderTitle();
      }
    }

    function clearAllChats() {
      if (Object.keys(chats).length === 0) return;
      if (confirm('Delete ALL conversations? This cannot be undone.')) {
        chats = {};
        saveChats();
        newChat();
      }
    }

    // ====================== MESSAGES ======================
    function renderMessages() {
      messagesContainer.innerHTML = '';
      if (!currentChatId || !chats[currentChatId]) return;
      const msgs = chats[currentChatId].messages;
      msgs.forEach((msg, index) => {
        addMessageElement(msg.text, msg.sender, index);
      });
      // If last message is from bot, add action buttons
      if (msgs.length > 0 && msgs[msgs.length - 1].sender === 'bot') {
        addActionButtonsToLastBotMessage();
      }
    }

    function addMessageElement(text, sender, index = null) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message ' + (sender === 'user' ? 'user-message' : 'bot-message');
      // Process code blocks
      const formatted = formatMessageText(text);
      msgDiv.innerHTML = formatted;
      if (sender === 'bot') {
        // Add copy button
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'message-actions';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn';
        copyBtn.innerHTML = '📋 Copy';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(text);
          copyBtn.innerHTML = '✅ Copied';
          setTimeout(() => { copyBtn.innerHTML = '📋 Copy'; }, 2000);
        });
        actionsDiv.appendChild(copyBtn);
        // If it's the last bot message, we'll add regenerate button later
        msgDiv.appendChild(actionsDiv);
      }
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addActionButtonsToLastBotMessage() {
      const lastMsg = messagesContainer.querySelector('.bot-message:last-child');
      if (!lastMsg) return;
      const actionsDiv = lastMsg.querySelector('.message-actions');
      if (!actionsDiv) return;
      // Check if regenerate button already exists
      if (!actionsDiv.querySelector('.regenerate-btn')) {
        const regenBtn = document.createElement('button');
        regenBtn.className = 'action-btn regenerate-btn';
        regenBtn.innerHTML = '🔄 Regenerate';
        regenBtn.addEventListener('click', regenerateLastResponse);
        actionsDiv.appendChild(regenBtn);
      }
    }

    function formatMessageText(text) {
      // Replace code blocks (``` ... ```) with styled blocks
      return text.replace(/```(\w*)\n?([\s\S]*?)```/g, (match, lang, code) => {
        return `<div class="code-block">${escapeHtml(code.trim())}</div>`;
      });
    }

    function addError(text) {
      const errDiv = document.createElement('div');
      errDiv.className = 'error-message';
      errDiv.textContent = '❌ ' + text;
      messagesContainer.appendChild(errDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function updateHeaderTitle() {
      if (currentChatId && chats[currentChatId]) {
        currentChatTitle.textContent = chats[currentChatId].title || 'New Chat';
      } else {
        currentChatTitle.textContent = 'New Chat';
      }
    }

    // Auto-title from first user message
    function autoTitle(chatId, message) {
      if (chats[chatId] && chats[chatId].title === 'New Chat') {
        chats[chatId].title = message.length > 30 ? message.substring(0, 30) + '...' : message;
        saveChats();
        renderChatList();
        updateHeaderTitle();
      }
    }

    // ====================== RENAME CHAT ======================
    currentChatTitle.addEventListener('click', () => {
      if (!currentChatId || !chats[currentChatId]) return;
      const oldTitle = chats[currentChatId].title;
      currentChatTitle.contentEditable = 'true';
      currentChatTitle.focus();
      // Select all text
      const range = document.createRange();
      range.selectNodeContents(currentChatTitle);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);

      const saveRename = () => {
        currentChatTitle.contentEditable = 'false';
        const newTitle = currentChatTitle.textContent.trim() || 'New Chat';
        chats[currentChatId].title = newTitle;
        saveChats();
        renderChatList();
        updateHeaderTitle();
        currentChatTitle.removeEventListener('blur', saveRename);
        currentChatTitle.removeEventListener('keydown', onEnter);
      };

      const onEnter = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          saveRename();
        }
      };

      currentChatTitle.addEventListener('blur', saveRename);
      currentChatTitle.addEventListener('keydown', onEnter);
    });

    // ====================== API CALL ======================
    async function sendMessage(userMessage, isRegenerate = false) {
      if (!currentChatId) newChat();

      if (!isRegenerate) {
        // Save user message
        chats[currentChatId].messages.push({ text: userMessage, sender: 'user' });
        chats[currentChatId].timestamp = Date.now();
        saveChats();
        renderMessages();
        autoTitle(currentChatId, userMessage);
      } else {
        // Remove the last bot message before regenerating
        const msgs = chats[currentChatId].messages;
        if (msgs.length > 0 && msgs[msgs.length - 1].sender === 'bot') {
          msgs.pop();
        }
        saveChats();
        renderMessages();
      }

      userInput.disabled = true;
      sendButton.disabled = true;

      const recentMessages = chats[currentChatId].messages.slice(-10).map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));

      const systemMsg = { role: 'system', content: 'You are EbubZ AI, a helpful assistant created by Ebube Arinze.' };
      const apiMessages = [systemMsg, ...recentMessages];

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: currentModel,
            messages: apiMessages,
            temperature: 0.7,
            max_tokens: 2000
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const botReply = data.choices[0].message.content;

        chats[currentChatId].messages.push({ text: botReply, sender: 'bot' });
        chats[currentChatId].timestamp = Date.now();
        saveChats();
        renderMessages();

      } catch (error) {
        console.error('API Error:', error);
        addError(error.message || 'Failed to get reply.');
      } finally {
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
      }
    }

    function regenerateLastResponse() {
      if (!currentChatId || !chats[currentChatId]) return;
      const msgs = chats[currentChatId].messages;
      if (msgs.length === 0 || msgs[msgs.length - 1].sender !== 'bot') return;
      // We resend the last user message (which is second-to-last)
      const lastUserMsg = msgs[msgs.length - 2];
      if (!lastUserMsg || lastUserMsg.sender !== 'user') return;
      sendMessage(lastUserMsg.text, true);
    }

    // ====================== SIDEBAR TOGGLE ======================
    function openSidebar() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
    }
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }

    // ====================== EVENT LISTENERS ======================
    menuToggle.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
    newChatBtn.addEventListener('click', newChat);
    clearAllBtn.addEventListener('click', clearAllChats);

    modelSelect.value = currentModel;
    modelSelect.addEventListener('change', (e) => {
      currentModel = e.target.value;
      saveModel();
    });

    sendButton.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (text) {
        sendMessage(text);
        userInput.value = '';
      }
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = userInput.value.trim();
        if (text) {
          sendMessage(text);
          userInput.value = '';
        }
      }
    });

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // ====================== INIT ======================
    function init() {
      loadChats();
      if (Object.keys(chats).length > 0) {
        currentChatId = Object.keys(chats).sort((a, b) => (chats[b].timestamp || 0) - (chats[a].timestamp || 0))[0];
      } else {
        newChat();
        return;
      }
      renderMessages();
      renderChatList();
      updateHeaderTitle();
    }

    init();
  </script>
</body>
</html>
