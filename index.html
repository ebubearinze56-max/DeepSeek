<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>EbubZ AI</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --sidebar-bg: #16213e;
      --msg-bot: #2a2a4a;
      --msg-user: #0f3460;
      --header-bg: #0f3460;
      --input-bg: #1a1a2e;
      --text: #e0e0e0;
      --border: #2a2a4a;
      --accent: #e94560;
      --code-bg: #0d1117;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    body.light {
      --bg: #f5f5f5;
      --sidebar-bg: #ffffff;
      --msg-bot: #e9e9eb;
      --msg-user: #d1e4ff;
      --header-bg: #e0e0e0;
      --input-bg: #ffffff;
      --text: #1a1a1a;
      --border: #cccccc;
      --accent: #d6336c;
      --code-bg: #f0f0f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      overflow: hidden;
    }
    .app { display: flex; height: 100vh; width: 100%; }

    /* AUTH OVERLAY */
    #auth-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .auth-box {
      background: var(--sidebar-bg);
      padding: 2rem; border-radius: 12px;
      text-align: left; max-width: 420px; width: 90%;
      color: var(--text);
    }
    .auth-box h2 { text-align: center; margin-bottom: 1rem; }
    .auth-box label { display: block; margin: 10px 0 4px; font-size: 0.85rem; }
    .auth-box input {
      display: block; width: 100%; margin: 0 0 10px 0; padding: 10px;
      border-radius: 6px; border: 1px solid var(--border);
      background: var(--input-bg); color: var(--text);
    }
    .auth-box button {
      background: var(--accent); color: #fff; border: none;
      padding: 10px 20px; border-radius: 6px; font-weight: bold;
      cursor: pointer; width: 100%; margin-top: 8px;
    }
    .auth-box .google-btn { background: #4285f4; }
    .auth-box .switch-link {
      margin-top: 12px; font-size: 0.8rem; cursor: pointer;
      color: var(--accent); text-decoration: underline; text-align: center; display: block;
    }
    .auth-box .error-msg { color: var(--accent); font-size: 0.8rem; margin-top: 5px; }
    .divider {
      display: flex; align-items: center; margin: 15px 0; color: var(--text); font-size: 0.8rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
    .divider span { margin: 0 10px; }

    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease;
      z-index: 10;
    }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
    .sidebar-header h1 { font-size: 1.2rem; font-weight: 600; }
    .creator { font-size: 0.7rem; opacity: 0.6; }
    .new-chat-btn, .clear-all-btn, .logout-btn {
      width: 100%; padding: 10px; color: #fff; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer;
      transition: background 0.2s; margin-top: 8px;
    }
    .new-chat-btn { background: var(--accent); }
    .new-chat-btn:hover { filter: brightness(1.1); }
    .clear-all-btn { background: #555; margin-top: 4px; font-size: 0.8rem; }
    .clear-all-btn:hover { background: #777; }
    .logout-btn { background: #b33; font-size: 0.8rem; margin-top: 4px; }
    .logout-btn:hover { background: #d44; }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-item {
      padding: 10px 12px; border-radius: 6px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: flex-start;
      margin-bottom: 4px; word-break: break-word; color: var(--text);
      gap: 6px;
    }
    .chat-item:hover { background: rgba(255,255,255,0.1); }
    .chat-item.active { background: var(--header-bg); }
    .chat-item .title-block { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .chat-item .title {
      font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-item .meta {
      font-size: 0.7rem; opacity: 0.6; display: flex; gap: 6px; align-items: center;
    }
    .chat-item .preview {
      font-size: 0.72rem; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 200px;
    }
    .chat-item .delete-btn {
      background: none; border: none; color: var(--accent); font-size: 1rem;
      cursor: pointer; opacity: 0.6; flex-shrink: 0;
    }
    .chat-item .delete-btn:hover { opacity: 1; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; }
    .chat-header {
      padding: 12px 20px; background: var(--header-bg);
      border-bottom: 1px solid var(--border); display: flex;
      align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .menu-toggle { background: none; border: none; color: var(--text); font-size: 1.4rem; cursor: pointer; display: none; }
    #current-chat-title { font-weight: 600; cursor: pointer; border-bottom: 1px dashed transparent; outline: none; color: var(--text); }
    #current-chat-title:hover { border-bottom-color: #aaa; }
    #current-chat-title[contenteditable="true"] { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; }
    .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, .header-btn {
      padding: 6px 10px; background: var(--input-bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 6px; font-size: 0.85rem; cursor: pointer;
    }
    .header-btn { background: var(--accent); color: #fff; border: none; }
    .header-btn.active { background: #4caf50; }
    .theme-toggle { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 4px; border-radius: 50%; color: var(--text); }

    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message {
      max-width: 80%; padding: 10px 16px; border-radius: 12px;
      line-height: 1.5; word-wrap: break-word; white-space: pre-wrap;
      position: relative; color: var(--text);
    }
    .user-message { align-self: flex-end; background: var(--msg-user); border-bottom-right-radius: 4px; }
    .bot-message { align-self: flex-start; background: var(--msg-bot); border-bottom-left-radius: 4px; }

    /* ⭐ NEW: Thinking bubble style (no more solid blue box) */
    .message.thinking {
      align-self: flex-start;
      background: transparent !important;
      border: 1px dashed var(--border);
      font-style: italic;
      opacity: 0.7;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    .message-actions { display: flex; gap: 6px; margin-top: 6px; opacity: 0; transition: opacity 0.2s; }
    .bot-message:hover .message-actions { opacity: 1; }
    .action-btn {
      background: rgba(128,128,128,0.2); border: none; color: var(--text);
      padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }
    .action-btn:hover { background: rgba(128,128,128,0.4); }
    .code-block {
      background: var(--code-bg); padding: 12px; border-radius: 6px;
      font-family: 'Cascadia Code', monospace; font-size: 0.9rem;
      overflow-x: auto; margin: 8px 0; white-space: pre; color: var(--text);
    }
    .file-attachment {
      display: flex; align-items: center; gap: 8px; padding: 8px;
      background: rgba(255,255,255,0.1); border-radius: 6px; margin-bottom: 8px;
    }
    .file-attachment img { max-width: 200px; max-height: 150px; border-radius: 4px; }
    .input-area {
      display: flex; padding: 12px; border-top: 1px solid var(--border);
      background: var(--header-bg); gap: 8px; flex-wrap: wrap;
    }
    #user-input {
      flex: 1; min-width: 200px; padding: 10px 16px; border: none; border-radius: 8px;
      background: var(--input-bg); color: var(--text); font-size: 1rem; outline: none;
    }
    #send-button, #file-upload-btn, #voice-btn {
      background: var(--accent); border: none; border-radius: 8px;
      color: #fff; font-weight: 600; cursor: pointer; padding: 10px 16px;
      display: flex; align-items: center; justify-content: center;
    }
    #send-button:hover, #file-upload-btn:hover, #voice-btn:hover { filter: brightness(1.1); }
    #send-button:disabled { background: #555; cursor: not-allowed; }
    #file-input { display: none; }
    .error-message { color: var(--accent); text-align: center; padding: 8px; font-size: 0.9rem; }

    /* ⭐ NEW: File context banner */
    .file-context-banner {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--input-bg);
      border-top: 1px solid var(--border); font-size: 0.8rem;
    }
    .file-context-banner .file-name { flex: 1; opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-context-banner .clear-file {
      background: var(--accent); color: #fff; border: none;
      border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 0.75rem;
    }
    .file-context-banner .clear-file:hover { filter: brightness(1.1); }

    /* MIND MAP */
    .mindmap {
      padding: 10px; border-top: 1px solid var(--border);
      background: var(--header-bg); display: flex; flex-wrap: wrap;
      gap: 6px; max-height: 80px; overflow-y: auto;
    }
    .mindmap span {
      background: var(--accent); color: #fff; padding: 4px 8px;
      border-radius: 12px; font-size: 0.75rem;
    }
    .mindmap .empty-hint {
      background: transparent !important; opacity: 0.5; padding: 2px 8px;
    }

    /* SETTINGS PANEL */
    .settings-panel {
      position: fixed; top: 0; right: 0; width: 300px; height: 100%;
      background: var(--sidebar-bg); border-left: 1px solid var(--border);
      transform: translateX(100%); transition: transform 0.3s ease;
      z-index: 30; padding: 20px; overflow-y: auto;
    }
    .settings-panel.open { transform: translateX(0); }
    .settings-panel h2 { margin-bottom: 15px; }
    .settings-panel label { display: block; margin: 10px 0 4px; }
    .settings-panel input[type="color"] { width: 100%; height: 40px; border: none; cursor: pointer; }
    .settings-panel select { width: 100%; margin-bottom: 10px; }
    .settings-panel button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

    .overlay {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9;
    }

    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 280px; z-index: 20; }
      .sidebar.open { transform: translateX(0); }
      .overlay.open { display: block; }
      .menu-toggle { display: block; }
      .model-selector { display: none; }
    }
  </style>
</head>
<body>

  <!-- AUTH OVERLAY -->
  <div id="auth-overlay">
    <div class="auth-box" id="auth-box"></div>
  </div>

  <!-- SETTINGS PANEL -->
  <div class="settings-panel" id="settings-panel">
    <h2>Customize Theme</h2>
    <label>Accent Color</label>
    <input type="color" id="accent-picker" value="#e94560">
    <label>Background</label>
    <input type="color" id="bg-picker" value="#1a1a2e">
    <label>Font</label>
    <select id="font-picker">
      <option value="'Segoe UI', system-ui, sans-serif">Default</option>
      <option value="'Courier New', monospace">Courier</option>
      <option value="'Georgia', serif">Georgia</option>
      <option value="'Comic Sans MS', cursive">Comic Sans</option>
    </select>
    <button id="reset-theme">Reset Default</button>
    <button style="margin-top:10px; background:#555;" id="close-settings">Close</button>
  </div>

  <div class="app" id="main-app" style="display:none;">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1>🤖 EbubZ AI</h1>
        <div class="creator">by Ebube Arinze</div>
        <button class="new-chat-btn" id="new-chat-btn">＋ New Chat</button>
        <button class="clear-all-btn" id="clear-all-btn">🗑️ Clear all chats</button>
        <button class="logout-btn" id="logout-btn">🚪 Log out</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- MAIN -->
    <div class="main">
      <div class="chat-header">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <span id="current-chat-title" title="Click to rename">New Chat</span>
        <div class="header-actions">
          <select id="persona-select">
            <option value="assistant">🤖 Assistant</option>
            <option value="shakespeare">🎭 Shakespeare</option>
            <option value="pirate">🏴‍☠️ Pirate</option>
            <option value="genz">💬 Gen Z</option>
            <option value="professor">🎓 Professor</option>
            <option value="confession">🕊️ Confession/Diary</option>
          </select>
          <button class="header-btn" id="think-toggle" title="DeepThink Mode">🧠 Think</button>
          <button class="header-btn" id="settings-toggle" title="Theme">🎨</button>
          <button class="theme-toggle" id="theme-toggle" title="Toggle theme">🌙</button>
        </div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="mindmap" id="mindmap"></div>
      <div class="file-context-banner" id="file-context-banner" style="display:none;">
        <span>📎</span>
        <span class="file-name" id="file-context-name"></span>
        <button class="clear-file" id="clear-file-btn">✕ Remove</button>
      </div>
      <div class="input-area">
        <button id="voice-btn" title="Voice input">🎤</button>
        <input type="text" id="user-input" placeholder="Ask anything..." autofocus>
        <button id="file-upload-btn" title="Upload document">📎</button>
        <input type="file" id="file-input" accept=".txt,.md,.csv">
        <button id="send-button">Send</button>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2OMJXHJH4FrEVEc4FDPib_zcmJ8hE95Y",
      authDomain: "ebubz-ai.firebaseapp.com",
      projectId: "ebubz-ai",
      storageBucket: "ebubz-ai.firebasestorage.app",
      messagingSenderId: "322975170208",
      appId: "1:322975170208:web:cfd5a80837d6ce77e393c5"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // ====================== CONFIGURATION ======================
    const BACKEND_URL = '/api/chat';
    const FORMSPREE_URL = 'https://formspree.io/f/meewpobq';

    let currentModel = 'llama-3.1-8b-instant';
    let documentContext = null;
    let documentName = null;
    let deepThink = false;
    let currentPersona = 'assistant';

    const personas = {
      assistant: "You are EbubZ AI, a helpful assistant created by Ebube Arinze. Be concise and friendly.",
      shakespeare: "Thou art EbubZ AI, a poetical assistant. Speak in the manner of William Shakespeare: use 'thou', 'thee', elaborate metaphors, and old English.",
      pirate: "Yarrr! Ye be EbubZ AI, a pirate assistant. Talk like a salty sea dog: say 'Arrr', 'me hearty', 'shiver me timbers', and use nautical slang.",
      genz: "You are EbubZ AI, but you're also a Gen Z teen. Use modern slang like 'no cap', 'fr', 'slay', 'bet', and include emojis. Be casual and upbeat.",
      professor: "You are Professor EbubZ, an academic AI. Use formal, precise language; cite concepts; explain thoroughly as if to a university student.",
      confession: "You are EbubZ AI in 'Confession/Diary Mode'. You are a compassionate, non-judgmental listener. Be extra empathetic, validate feelings, and keep responses gentle and supportive. Never share or judge."
    };

    // Stopwords — filters out common English + code keywords from the mind map
    const STOPWORDS = new Set([
      'the','a','an','and','or','but','if','then','else','when','while','for','to','of','in','on','at','by','with','as','is','was','are','were','be','been','being','this','that','these','those','it','its','i','you','your','me','my','we','our','they','their','he','she','his','her','them','him','us',
      'have','has','had','do','does','did','will','would','could','should','can','may','might','must','shall',
      'not','no','yes','all','any','some','what','which','who','whom','where','why','how',
      'about','into','through','during','before','after','above','below','from','up','down','out','off','over','under','again','further','once','here','there',
      'one','two','three','just','like','than','other','such','only','own','same','too','very','also','well','more','most',
      'const','let','var','function','class','return','true','false','null','none','undefined','async','await','import','export','from','new','this','typeof','instanceof',
      'div','span','button','input','select','option','label','form','script','style','meta','head','body','html','lang','charset','viewport',
      'background','padding','margin','border','color','display','width','height','font','fontsize','fontfamily','fontweight','textalign','textdecoration','texttransform','lineheight','letterspacing',
      'flex','grid','block','inline','absolute','relative','fixed','static','sticky','hidden','visible','auto','center','left','right','top','bottom','none','inherit','initial',
      'cursor','pointer','hover','focus','active','disabled','checked','selected','readonly','required','placeholder','value','name','type','id','href','src','alt','title','content','data','role','aria',
      'vartxt','varaccent','varbg','varborder','varfont','varmsg','currentchatid','savechats','loadchats','renderchatlist','rendermessages','sendmessage','initapp','loadtheme',
      'localstorage','setitem','getitem','removeitem','document','window','queryselector','addeventlistener','preventdefault','innerhtml','textcontent','appendchild','createelement',
      'fetch','json','string','number','boolean','array','object','error','success','response','request','event','handler','callback','promise','resolve','reject',
      'monday','tuesday','wednesday','thursday','friday','saturday','sunday','today','yesterday','tomorrow','date','time','year','month','day','hour','minute','second'
    ]);

    // DOM elements
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const menuToggle = document.getElementById('menu-toggle');
    const chatListEl = document.getElementById('chat-list');
    const newChatBtn = document.getElementById('new-chat-btn');
    const clearAllBtn = document.getElementById('clear-all-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const messagesContainer = document.getElementById('chat-messages');
    const userInput = document.getElementById('user-input');
    const sendButton = document.getElementById('send-button');
    const currentChatTitle = document.getElementById('current-chat-title');
    const themeToggle = document.getElementById('theme-toggle');
    const fileUploadBtn = document.getElementById('file-upload-btn');
    const fileInput = document.getElementById('file-input');
    const voiceBtn = document.getElementById('voice-btn');
    const thinkToggle = document.getElementById('think-toggle');
    const personaSelect = document.getElementById('persona-select');
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPanel = document.getElementById('settings-panel');
    const mindmapEl = document.getElementById('mindmap');
    const authOverlay = document.getElementById('auth-overlay');
    const authBox = document.getElementById('auth-box');
    const mainApp = document.getElementById('main-app');
    const fileContextBanner = document.getElementById('file-context-banner');
    const fileContextName = document.getElementById('file-context-name');
    const clearFileBtn = document.getElementById('clear-file-btn');

    let chats = {};
    let currentChatId = null;
    let recognition = null;
    const synth = window.speechSynthesis;

    // ====================== AUTHENTICATION UI ======================
    let authMode = 'main';

    function renderAuthForm() {
      authBox.innerHTML = '';
      if (authMode === 'main') {
        authBox.innerHTML = `
          <h2>Welcome to EbubZ AI</h2>
          <button class="google-btn" id="google-signin">🔵 Sign in with Google</button>
          <div class="divider"><span>or</span></div>
          <button id="email-signin">📧 Sign in with Email</button>
          <p style="text-align:center; font-size:0.75rem; margin-top:8px; opacity:0.7;">Yahoo, Gmail, any email works</p>
        `;
        document.getElementById('google-signin').addEventListener('click', () => {
          signInWithPopup(auth, googleProvider).catch(err => showError(err.message));
        });
        document.getElementById('email-signin').addEventListener('click', () => { authMode = 'email'; renderAuthForm(); });
      }
      else if (authMode === 'email') {
        authBox.innerHTML = `
          <h2>Sign In / Sign Up</h2>
          <label for="auth-email">Email (Yahoo, Gmail, etc.)</label>
          <input type="email" id="auth-email" placeholder="you@yahoo.com" autocomplete="email">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="Min 6 characters">
          <div class="error-msg" id="auth-error"></div>
          <button id="email-submit-signin">Sign In</button>
          <button id="email-submit-signup">Sign Up</button>
          <div class="switch-link" id="back-to-main">← Back</div>
        `;
        document.getElementById('email-submit-signin').addEventListener('click', () => handleEmailAuth('signin'));
        document.getElementById('email-submit-signup').addEventListener('click', () => handleEmailAuth('signup'));
        document.getElementById('back-to-main').addEventListener('click', () => { authMode = 'main'; renderAuthForm(); });
      }
    }

    function showError(msg, elementId = 'auth-error') {
      const el = document.getElementById(elementId);
      if (el) el.textContent = msg;
    }

    async function handleEmailAuth(action) {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      if (!email || !password) return showError('All fields required');
      if (password.length < 6) return showError('Password min 6 characters');
      try {
        if (action === 'signup') {
          await createUserWithEmailAndPassword(auth, email, password);
          fetch(FORMSPREE_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, type: 'signup', timestamp: new Date().toISOString() })
          }).catch(() => {});
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        showError(err.message);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        authOverlay.style.display = 'none';
        authOverlay.innerHTML = '';
        mainApp.style.display = 'flex';
        if (!chatListEl.hasChildNodes()) {
          initApp();
        }
      } else {
        authOverlay.style.display = 'flex';
        mainApp.style.display = 'none';
        authMode = 'main';
        renderAuthForm();
      }
    });

    logoutBtn.addEventListener('click', () => signOut(auth));

    // ====================== THEME & SETTINGS ======================
    function loadTheme() {
      const theme = localStorage.getItem('ebubz_theme') || 'dark';
      document.body.classList.toggle('light', theme === 'light');
      themeToggle.textContent = theme === 'light' ? '☀️' : '🌙';
      const accent = localStorage.getItem('ebubz_accent') || '#e94560';
      const bg = localStorage.getItem('ebubz_bg') || (theme === 'light' ? '#f5f5f5' : '#1a1a2e');
      const font = localStorage.getItem('ebubz_font') || "'Segoe UI', system-ui, sans-serif";
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--bg', bg);
      document.documentElement.style.setProperty('--font', font);
      document.getElementById('accent-picker').value = accent;
      document.getElementById('bg-picker').value = bg;
      document.getElementById('font-picker').value = font;
    }

    themeToggle.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light');
      localStorage.setItem('ebubz_theme', isLight ? 'light' : 'dark');
      themeToggle.textContent = isLight ? '☀️' : '🌙';
      loadTheme();
    });

    settingsToggle.addEventListener('click', () => settingsPanel.classList.toggle('open'));
    document.getElementById('close-settings').addEventListener('click', () => settingsPanel.classList.remove('open'));
    document.getElementById('accent-picker').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--accent', e.target.value);
      localStorage.setItem('ebubz_accent', e.target.value);
    });
    document.getElementById('bg-picker').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg', e.target.value);
      localStorage.setItem('ebubz_bg', e.target.value);
    });
    document.getElementById('font-picker').addEventListener('change', (e) => {
      document.documentElement.style.setProperty('--font', e.target.value);
      localStorage.setItem('ebubz_font', e.target.value);
    });
    document.getElementById('reset-theme').addEventListener('click', () => {
      localStorage.removeItem('ebubz_accent');
      localStorage.removeItem('ebubz_bg');
      localStorage.removeItem('ebubz_font');
      loadTheme();
    });

    // ====================== PERSONA & DEEPTHINK ======================
    personaSelect.addEventListener('change', (e) => { currentPersona = e.target.value; });
    thinkToggle.addEventListener('click', () => {
      deepThink = !deepThink;
      thinkToggle.classList.toggle('active', deepThink);
    });

    // ====================== VOICE ======================
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';
      recognition.addEventListener('result', (event) => {
        const transcript = event.results[0][0].transcript;
        userInput.value = transcript;
        sendButton.click();
      });
      recognition.addEventListener('error', (e) => {
        console.error('Speech recognition error', e);
        voiceBtn.textContent = '🎤';
      });
    } else {
      voiceBtn.style.display = 'none';
    }

    voiceBtn.addEventListener('click', () => {
      if (recognition) {
        if (voiceBtn.textContent === '🎤') {
          recognition.start();
          voiceBtn.textContent = '⏺️';
        } else {
          recognition.stop();
          voiceBtn.textContent = '🎤';
        }
      }
    });

    function speakText(text) {
      if (synth.speaking) synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9;
      synth.speak(utterance);
    }

    // ====================== FILE UPLOAD ======================
    function updateFileContextBanner() {
      if (documentContext) {
        fileContextBanner.style.display = 'flex';
        fileContextName.textContent = documentName || 'Attached document';
      } else {
        fileContextBanner.style.display = 'none';
      }
    }

    function clearFileContext() {
      documentContext = null;
      documentName = null;
      fileInput.value = '';
      updateFileContextBanner();
    }

    clearFileBtn.addEventListener('click', clearFileContext);

    fileUploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 1_000_000) {
        alert('File too large. Please upload documents under 1 MB.');
        fileInput.value = '';
        return;
      }
      try {
        const text = await file.text();
        documentContext = text;
        documentName = file.name;
        userInput.value = userInput.value.trim() || 'Summarize the uploaded document.';
        userInput.focus();
        updateFileContextBanner();
      } catch (err) {
        console.error('File read error', err);
        alert('Could not read that file.');
      }
      fileInput.value = '';
    });

    // ====================== PROMPT CHAINS ======================
    function createQuickActions() {
      if (document.getElementById('quick-actions-container')) return;

      const actions = ['Explain like I’m 5', 'Summarize', 'Translate to French', 'Write a poem'];
      const container = document.createElement('div');
      container.id = 'quick-actions-container';
      container.style.display = 'flex';
      container.style.gap = '6px';
      container.style.padding = '6px 12px';
      container.style.flexWrap = 'wrap';
      actions.forEach(action => {
        const btn = document.createElement('button');
        btn.textContent = action;
        btn.className = 'action-btn';
        btn.style.background = 'var(--header-bg)';
        btn.addEventListener('click', () => {
          let prefix = '';
          if (action === 'Explain like I’m 5') prefix = 'Explain like I’m 5: ';
          else if (action === 'Summarize') prefix = 'Summarize: ';
          else if (action === 'Translate to French') prefix = 'Translate to French: ';
          else if (action === 'Write a poem') prefix = 'Write a poem about: ';
          userInput.value = prefix + userInput.value;
          userInput.focus();
        });
        container.appendChild(btn);
      });
      messagesContainer.parentNode.insertBefore(container, messagesContainer.nextSibling);
    }

    // ====================== MIND MAP ======================
    function updateMindMap() {
      const words = {};
      if (currentChatId && chats[currentChatId]) {
        chats[currentChatId].messages.forEach(msg => {
          msg.text.split(/\s+/).forEach(word => {
            const w = word.toLowerCase().replace(/[^a-z]/g, '');
            if (w.length > 3 && !STOPWORDS.has(w)) {
              words[w] = (words[w] || 0) + 1;
            }
          });
        });
      }
      const topWords = Object.entries(words).sort((a, b) => b[1] - a[1]).slice(0, 10);
      mindmapEl.innerHTML = topWords.length
        ? topWords.map(([word]) => `<span>${escapeHtml(word)}</span>`).join('')
        : '<span class="empty-hint">No keywords yet</span>';
    }

    // ====================== SIDEBAR & CHAT LOGIC ======================
    function saveChats() { localStorage.setItem('ebubz_chats', JSON.stringify(chats)); }
    function loadChats() { const s = localStorage.getItem('ebubz_chats'); chats = s ? JSON.parse(s) : {}; }

    function formatRelativeDate(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));
      if (diffDays === 1) return 'Yesterday';
      if (diffDays < 7) return d.toLocaleDateString([], { weekday: 'short' });
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function getChatPreview(chat) {
      if (!chat.messages || !chat.messages.length) return 'No messages yet';
      const firstUser = chat.messages.find(m => m.sender === 'user');
      if (!firstUser) return 'No messages yet';
      return firstUser.text.length > 40 ? firstUser.text.substring(0, 40) + '…' : firstUser.text;
    }

    function renderChatList() {
      chatListEl.innerHTML = '';
      const ids = Object.keys(chats).sort((a, b) => (chats[b].timestamp || 0) - (chats[a].timestamp || 0));
      if (ids.length === 0) {
        const empty = document.createElement('div');
        empty.style.opacity = '0.5';
        empty.style.fontSize = '0.85rem';
        empty.style.padding = '12px';
        empty.style.textAlign = 'center';
        empty.textContent = 'No chats yet';
        chatListEl.appendChild(empty);
        return;
      }
      ids.forEach(id => {
        const chat = chats[id];
        const div = document.createElement('div');
        div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
        div.innerHTML = `
          <div class="title-block">
            <span class="title">${escapeHtml(chat.title || 'New Chat')}</span>
            <div class="meta">
              <span class="preview">${escapeHtml(getChatPreview(chat))}</span>
              <span>·</span>
              <span>${formatRelativeDate(chat.timestamp)}</span>
            </div>
          </div>
          <button class="delete-btn" data-id="${id}" title="Delete">🗑️</button>
        `;
        div.querySelector('.title-block').addEventListener('click', () => switchChat(id));
        div.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteChat(id); });
        chatListEl.appendChild(div);
      });
    }

    function switchChat(id) {
      currentChatId = id;
      clearFileContext();
      renderMessages();
      renderChatList();
      updateHeaderTitle();
      closeSidebar();
      updateMindMap();
    }

    function newChat() {
      const id = Date.now().toString();
      chats[id] = { title: 'New Chat', messages: [], timestamp: Date.now() };
      currentChatId = id;
      clearFileContext();
      saveChats();
      renderMessages();
      renderChatList();
      updateHeaderTitle();
      closeSidebar();
      userInput.focus();
      updateMindMap();
    }

    function deleteChat(id) {
      if (confirm('Delete this conversation?')) {
        delete chats[id];
        saveChats();
        if (currentChatId === id) {
          const remaining = Object.keys(chats);
          currentChatId = remaining.length > 0 ? remaining[remaining.length - 1] : null;
          if (!currentChatId) {
            newChat();
            return;
          }
        }
        renderMessages();
        renderChatList();
        updateHeaderTitle();
        updateMindMap();
      }
    }

    function clearAllChats() {
      if (Object.keys(chats).length && confirm('Delete ALL conversations?')) {
        chats = {};
        saveChats();
        newChat();
        updateMindMap();
      }
    }

    function renderMessages() {
      messagesContainer.innerHTML = '';
      if (!currentChatId || !chats[currentChatId]) return;
      const msgs = chats[currentChatId].messages;
      msgs.forEach((msg, idx) => addMessageElement(msg.text, msg.sender, idx));
      if (msgs.length && msgs[msgs.length - 1].sender === 'bot') addActionButtonsToLastBotMessage();
    }

    function addMessageElement(text, sender, index = null) {
      const div = document.createElement('div');
      div.className = `message ${sender}-message`;
      div.innerHTML = formatMessageText(text);
      if (sender === 'bot') {
        const actions = document.createElement('div');
        actions.className = 'message-actions';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'action-btn'; copyBtn.textContent = '📋 Copy';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(text);
          copyBtn.textContent = '✅ Copied';
          setTimeout(() => copyBtn.textContent = '📋 Copy', 2000);
        });
        const speakBtn = document.createElement('button');
        speakBtn.className = 'action-btn'; speakBtn.textContent = '🔊 Speak';
        speakBtn.addEventListener('click', () => speakText(text));
        actions.appendChild(copyBtn);
        actions.appendChild(speakBtn);
        div.appendChild(actions);
      }
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addActionButtonsToLastBotMessage() {
      const last = messagesContainer.querySelector('.bot-message:last-child');
      if (!last) return;
      const actions = last.querySelector('.message-actions');
      if (!actions || actions.querySelector('.regenerate-btn')) return;
      const regenBtn = document.createElement('button');
      regenBtn.className = 'action-btn regenerate-btn';
      regenBtn.textContent = '🔄 Regenerate';
      regenBtn.addEventListener('click', regenerateLastResponse);
      actions.appendChild(regenBtn);
    }

    function formatMessageText(text) {
      return text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => `<div class="code-block">${escapeHtml(code.trim())}</div>`);
    }

    function updateHeaderTitle() {
      currentChatTitle.textContent = currentChatId && chats[currentChatId] ? (chats[currentChatId].title || 'New Chat') : 'New Chat';
    }

    function autoTitle(chatId, msg) {
      if (chats[chatId]?.title === 'New Chat') {
        chats[chatId].title = msg.length > 30 ? msg.substring(0, 30) + '...' : msg;
        saveChats();
        renderChatList();
        updateHeaderTitle();
      }
    }

    currentChatTitle.addEventListener('click', () => {
      if (!currentChatId || !chats[currentChatId]) return;
      currentChatTitle.contentEditable = 'true';
      currentChatTitle.focus();
      const range = document.createRange();
      range.selectNodeContents(currentChatTitle);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      const save = () => {
        currentChatTitle.contentEditable = 'false';
        chats[currentChatId].title = currentChatTitle.textContent.trim() || 'New Chat';
        saveChats();
        renderChatList();
        updateHeaderTitle();
        currentChatTitle.removeEventListener('blur', save);
        currentChatTitle.removeEventListener('keydown', onEnter);
      };
      const onEnter = (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } };
      currentChatTitle.addEventListener('blur', save);
      currentChatTitle.addEventListener('keydown', onEnter);
    });

    // ====================== THINKING BUBBLE (NEW) ======================
    function addThinkingBubble() {
      const div = document.createElement('div');
      div.className = 'message bot-message thinking';
      div.id = 'thinking-bubble';
      div.innerHTML = '⏳ Thinking...';
      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return div;
    }

    function removeThinkingBubble() {
      const el = document.getElementById('thinking-bubble');
      if (el) el.remove();
    }

    // ====================== DEEPTHINK ======================
    async function performDeepThink(messages) {
      try {
        const thinkPrompt = [...messages, { role: 'user', content: 'Think step by step before answering. Provide only your reasoning.' }];
        const resp = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: currentModel, messages: thinkPrompt, temperature: 0.3, max_tokens: 500 })
        });
        if (!resp.ok) return null;
        const data = await resp.json();
        return data.choices?.[0]?.message?.content || null;
      } catch (e) {
        console.error('DeepThink failed', e);
        return null;
      }
    }

    // ====================== API CALL ======================
    async function sendMessage(userMessage, isRegenerate = false) {
      if (!currentChatId) newChat();
      if (!isRegenerate) {
        chats[currentChatId].messages.push({ text: userMessage, sender: 'user' });
        chats[currentChatId].timestamp = Date.now();
        saveChats();
        renderMessages();
        autoTitle(currentChatId, userMessage);
      } else {
        const msgs = chats[currentChatId].messages;
        if (msgs.length && msgs[msgs.length - 1].sender === 'bot') msgs.pop();
        saveChats();
        renderMessages();
      }
      userInput.disabled = true;
      sendButton.disabled = true;

      let recent = chats[currentChatId].messages.slice(-10).map(m => ({
        role: m.sender === 'user' ? 'user' : 'assistant',
        content: m.text
      }));

      let systemContent = personas[currentPersona];
      if (documentContext) {
        const truncated = documentContext.length > 8000
          ? documentContext.substring(0, 8000) + '...[truncated]'
          : documentContext;
        systemContent += `\n\nThe user has uploaded a document${documentName ? ` ("${documentName}")` : ''}. Use it as context when relevant:\n${truncated}`;
      }

      const apiMessages = [
        { role: 'system', content: systemContent },
        ...recent
      ];

      addThinkingBubble();

      try {
        let finalMessages = apiMessages;
        if (deepThink) {
          const reasoning = await performDeepThink(apiMessages);
          if (reasoning) {
            finalMessages = [
              ...apiMessages,
              { role: 'assistant', content: `[Internal reasoning: ${reasoning}]` }
            ];
          }
        }

        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: currentModel, messages: finalMessages, temperature: 0.7, max_tokens: 2000 })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${response.status} — backend not deployed or API key missing`);
        }

        const data = await response.json();
        const botReply = data.choices?.[0]?.message?.content || '⚠️ Empty response from model.';

        removeThinkingBubble();
        addMessageElement(botReply, 'bot');
        chats[currentChatId].messages.push({ text: botReply, sender: 'bot' });
        chats[currentChatId].timestamp = Date.now();
        saveChats();
        addActionButtonsToLastBotMessage();
        updateMindMap();
        renderChatList();
      } catch (error) {
        console.error(error);
        removeThinkingBubble();
        addError(error.message || 'Failed to get reply');
      } finally {
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
      }
    }

    function regenerateLastResponse() {
      if (!currentChatId || !chats[currentChatId]) return;
      const msgs = chats[currentChatId].messages;
      if (msgs.length < 2) return;
      const lastUser = msgs[msgs.length - 2];
      if (lastUser?.sender !== 'user') return;
      sendMessage(lastUser.text, true);
    }

    function addError(text) {
      const errDiv = document.createElement('div');
      errDiv.className = 'error-message';
      errDiv.textContent = '❌ ' + text;
      messagesContainer.appendChild(errDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // ====================== SIDEBAR TOGGLE ======================
    function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
    function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

    menuToggle.addEventListener('click', openSidebar);
    overlay.addEventListener('click', closeSidebar);
    newChatBtn.addEventListener('click', newChat);
    clearAllBtn.addEventListener('click', clearAllChats);

    sendButton.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (text) { sendMessage(text); userInput.value = ''; }
    });
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendButton.click(); }
    });

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, m => map[m]);
    }

    function initApp() {
      loadTheme();
      loadChats();
      const ids = Object.keys(chats);
      if (ids.length) {
        currentChatId = ids.sort((a, b) => (chats[b].timestamp || 0) - (chats[a].timestamp || 0))[0];
        renderMessages();
        renderChatList();
        updateHeaderTitle();
        updateMindMap();
      } else {
        newChat();
      }
      createQuickActions();
    }

    // Initial auth render
    renderAuthForm();
  </script>
</body>
</html>
